<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일 화면에 꽉 차게, 아이폰 앱처럼 보이게 하는 필수 태그들 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Maple Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 상단 검색 영역 -->
  <header>
    <h1>Maple Player 🍁</h1>
    <input type="text" id="searchInput" placeholder="곡 제목, 설명, 태그로 검색해보세요...">
  </header>

  <!-- 음악 리스트가 뜰 영역 -->
  <main id="trackList">
    <!-- 자바스크립트가 여기에 곡 목록을 채워넣을 거야 -->
  </main>

<!-- 기존 <footer> 삭제 후 아래 코드로 교체 -->
  <div id="bottomSheet">
    <!-- 1. 항상 보이는 플레이어 바 -->
    <div id="playerBar">
      <!-- 클릭하면 올라오게 할 영역 -->
      <div class="now-playing" id="nowPlayingArea">
        <span id="currentTitle">재생 중인 곡이 없습니다</span>
        <span class="chevron">▲</span> <!-- 올리고 내리는 아이콘 -->
      </div>
      <div class="controls">
        <button id="prevBtn">⏮</button>
        <button id="playBtn">▶️</button>
        <button id="nextBtn">⏭</button>
      </div>
    </div>
    
    <!-- 2. 위로 스와이프하면 보이는 대기열 영역 -->
    <div id="queueContainer">
      <div class="queue-header">
        <h3>재생 대기열</h3>
        <button id="clearQueueBtn">비우기</button>
      </div>
      <div id="queueList">
        <!-- JS가 여기에 대기열을 채워넣음 -->
      </div>
    </div>
  </div>

<!-- ⭐️ 옵션 메뉴 팝업 (Action Sheet) -->
  <div id="optionOverlay" class="hidden"></div> <!-- 메뉴 떴을 때 배경 어둡게 -->
  <div id="optionMenu" class="hidden">
    <div class="option-header">
      <h3 id="optionTitle">곡 제목</h3>
      <p id="optionDesc">설명</p>
    </div>
    <ul class="option-list">
      <li id="optPlayNext">다음에 재생</li>
      <li id="optPlayLast">마지막에 재생</li>
      <li id="optAddPlaylist">플레이리스트에 추가</li>
      <li id="optEditTag">태그 편집</li>
    </ul>
    <button id="optionCloseBtn">닫기</button>
  </div>

  <!-- ⭐️ 추가: 백그라운드 유지를 위해 HTML에 직접 오디오 태그 삽입 -->
  <audio id="mainAudio" preload="metadata"></audio>

  <script src="app.js"></script>
</body>
</html>
