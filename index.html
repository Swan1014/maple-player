<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Maple Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Maple Player 🍁</h1>
    <!-- ⭐️ 1. 상단 탭 버튼 추가 -->
    <div class="tabs">
      <button id="tabAll" class="tab-btn active">전체 곡</button>
      <button id="tabPlaylist" class="tab-btn">내 플레이리스트</button>
    </div>
    <input type="text" id="searchInput" placeholder="곡 제목, 설명, 태그로 검색해보세요...">
  </header>

  <!-- ⭐️ 2. 화면 영역을 두 개로 분리 -->
  <!-- 화면 A: 전체 곡 목록 (기존과 동일) -->
  <main id="trackList" class="view-area active">
  </main>

  <!-- 화면 B: 플레이리스트 관리 목록 -->
  <main id="playlistView" class="view-area">
    <div class="playlist-header">
      <button id="createNewPlaylistBtn">새 플레이리스트 만들기 ➕</button>
    </div>
    <div id="playlistContainer">
      <!-- JS가 여기에 플레이리스트 폴더들을 그릴 거야 -->
    </div>
  </main>

<!-- ⭐️ 새로 추가할 화면 C: 플레이리스트 상세(곡 목록) 화면 -->
  <main id="playlistDetailView" class="view-area">
    <div class="playlist-detail-header">
      <button id="backToPlaylistBtn">◀ 뒤로 가기</button>
      <h2 id="detailTitle">플레이리스트 이름</h2>
      <p id="detailCount">0곡</p>
      <!-- ⭐️ 커다란 전체 재생 버튼 -->
      <button id="playAllBtn">전체 재생 ▶️</button>
    </div>
    <!-- 이 플레이리스트에 들어있는 곡들이 뜰 공간 -->
    <div id="detailTrackList"></div>
  </main>

  <!-- 하단 바텀 시트 (기존과 동일) -->
  <div id="bottomSheet">
    <div id="playerBar">
      <div class="now-playing" id="nowPlayingArea">
        <span id="currentTitle">재생 중인 곡이 없습니다</span>
        <span class="chevron">▲</span>
      </div>
      <div class="controls">
        <button id="prevBtn">⏮</button>
        <button id="playBtn">▶️</button>
        <button id="nextBtn">⏭</button>
      </div>
    </div>
    <div id="queueContainer">
      <div class="queue-header">
        <h3>재생 대기열</h3>
        <button id="clearQueueBtn">비우기</button>
      </div>
      <div id="queueList"></div>
    </div>
  </div>

  <!-- 옵션 팝업 (Action Sheet) (기존과 동일) -->
  <div id="optionOverlay" class="hidden"></div>
  <div id="optionMenu" class="hidden">
    <div class="option-header">
      <h3 id="optionTitle">곡 제목</h3>
      <p id="optionDesc">설명</p>
    </div>
    <ul class="option-list">
      <li id="optPlayNext">다음에 재생</li>
      <li id="optPlayLast">마지막에 재생</li>
      <li id="optRemoveQueue">대기열에서 삭제</li>
      <li id="optAddPlaylist">플레이리스트에 추가</li>
      <li id="optEditTag">태그 편집</li>
    </ul>
    <button id="optionCloseBtn">닫기</button>
  </div>

<!-- ⭐️ 플레이리스트 선택 팝업 -->
  <div id="playlistSelectOverlay" class="hidden"></div>
  <div id="playlistSelectMenu" class="hidden">
    <div class="option-header">
      <h3>어느 플레이리스트에 추가할까요?</h3>
    </div>
    <ul class="option-list" id="playlistSelectList">
      <!-- JS가 여기에 내 폴더 목록을 뿌려줌 -->
    </ul>
    <button id="playlistSelectCloseBtn">취소</button>
  </div>
  
  <audio id="mainAudio" preload="metadata"></audio>
  <script src="app.js"></script>
</body>
</html>

  <audio id="mainAudio" preload="metadata"></audio>
  <script src="app.js"></script>
</body>
</html>
