<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- ⭐️ 아이폰(iOS) 홈 화면 앱 아이콘 -->
  <link rel="apple-touch-icon" href="assets/app-icon/icon-192.png">
  <!-- ⭐️ 일반 웹 브라우저 탭 아이콘 (파비콘) -->
  <link rel="icon" type="image/png" sizes="192x192" href="assets/app-icon/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/app-icon/icon-512.png">
  <!-- ⭐️ 진정한 PWA(웹 앱) 인증서 연결 -->
  <link rel="manifest" href="manifest.json">
  <title>Maple Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-title-row">
      <h1>Maple Player 🍁</h1>
      <button id="settingsBtn" class="icon-btn">⚙️</button>
    </div>
    <div class="tabs">
      <button id="tabAll" class="tab-btn active">전체 곡</button>
      <button id="tabPlaylist" class="tab-btn">내 플레이리스트</button>
    </div>
    <input type="text" id="searchInput" placeholder="곡 제목, 설명, 태그로 검색해보세요...">
  </header>

  <!-- ⭐️ 2. 화면 영역을 두 개로 분리 -->
  <!-- 화면 A: 전체 곡 목록 (기존과 동일) -->
  <main id="trackList" class="view-area active">
  </main>

  <!-- 화면 B: 플레이리스트 관리 목록 -->
  <main id="playlistView" class="view-area">
    <div class="playlist-header">
      <button id="createNewPlaylistBtn">새 플레이리스트 만들기 ➕</button>
    </div>
    <div id="playlistContainer">
      <!-- JS가 여기에 플레이리스트 폴더들을 그릴 거야 -->
    </div>
  </main>

<!-- ⭐️ 새로 추가할 화면 C: 플레이리스트 상세(곡 목록) 화면 -->
  <main id="playlistDetailView" class="view-area">
    <div class="playlist-detail-header">
      <button id="backToPlaylistBtn">◀ 뒤로 가기</button>
      <h2 id="detailTitle">플레이리스트 이름</h2>
      <p id="detailCount">0곡</p>
      <!-- ⭐️ 커다란 전체 재생 버튼 -->
      <button id="playAllBtn">전체 재생 ▶️</button>
    </div>
    <!-- 이 플레이리스트에 들어있는 곡들이 뜰 공간 -->
    <div id="detailTrackList"></div>
  </main>

  <!-- 하단 바텀 시트 (기존과 동일) -->
  <div id="bottomSheet">
    <div id="playerBar">
      <div class="now-playing" id="nowPlayingArea">
        <img id="currentIcon" src="" alt="icon" style="display: none; width: 38px; height: px; border-radius: 4px; margin-right: 10px; object-fit: contain;">
        <span id="currentTitle">재생 중인 곡이 없습니다</span>
        <span class="chevron">▲</span>
      </div>
      <div class="controls">
        <button id="shuffleBtn" class="toggle-btn">🔀</button>
        <button id="prevBtn">⏮</button>
        <button id="playBtn">▶️</button>
        <button id="nextBtn">⏭</button>
        <button id="repeatBtn" class="toggle-btn">🔁</button>
      </div>
    </div>
    <div id="queueContainer">
      <div class="queue-header">
        <h3>재생 대기열</h3>
        <button id="clearQueueBtn">비우기</button>
      </div>
      <div id="queueList"></div>
    </div>
  </div>

  <!-- 옵션 팝업 (Action Sheet) (기존과 동일) -->
  <div id="optionOverlay" class="hidden"></div>
  <div id="optionMenu" class="hidden">
    <div class="option-header" style="display: flex; align-items: center; gap: 12px;">
      <!-- ⭐️ 아이콘 추가됨 -->
      <img id="optionIcon" src="" alt="icon" style="display: none; width: 38px; height: 38px; border-radius: 4px; object-fit: contain;">
      <div style="flex: 1; overflow: hidden;">
        <h3 id="optionTitle" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">곡 제목</h3>
        <p id="optionDesc" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">설명</p>
      </div>
    </div>
    <ul class="option-list">
      <li id="optPlayNext">다음에 재생</li>
      <li id="optPlayLast">마지막에 재생</li>
      <li id="optRemoveQueue">대기열에서 삭제</li>
      <li id="optAddPlaylist">플레이리스트에 추가</li>
      <li id="optEditTag">태그 편집</li>
    </ul>
    <button id="optionCloseBtn">닫기</button>
  </div>

<!-- ⭐️ 플레이리스트 선택 팝업 -->
  <div id="playlistSelectOverlay" class="hidden"></div>
  <div id="playlistSelectMenu" class="hidden">
    <div class="option-header">
      <h3>어느 플레이리스트에 추가할까요?</h3>
    </div>
    <ul class="option-list" id="playlistSelectList">
      <!-- JS가 여기에 내 폴더 목록을 뿌려줌 -->
    </ul>
    <button id="playlistSelectCloseBtn">취소</button>
  </div>
  
<!-- ⭐️ 태그 편집 팝업 -->
  <div id="tagEditOverlay" class="hidden"></div>
  <div id="tagEditMenu" class="hidden">
    <div class="option-header">
      <h3 id="tagEditTitle">태그 편집</h3>
      <p id="tagEditDesc">이 곡에 지정할 태그를 선택하세요.</p>
    </div>
    <ul class="tag-list" id="tagCheckList">
      <!-- JS로 태그 목록과 체크박스 렌더링 -->
    </ul>
    <div class="tag-create-area">
      <!-- ⭐️ 색상 선택기와 텍스트 입력창 -->
      <input type="color" id="newTagColor" value="#ff7f00">
      <input type="text" id="newTagName" placeholder="새 태그 이름">
      <button id="createNewTagBtn">추가</button>
    </div>
    <button id="tagEditCloseBtn">완료</button>
  </div>

  <!-- ⭐️ 설정(백업/복원) 팝업 -->
  <div id="settingsOverlay" class="hidden"></div>
  <div id="settingsModal" class="hidden">
    <div class="settings-header">
      <h3>설정</h3>
      <button id="settingsCloseBtn">✖</button>
    </div>
    <div class="settings-body">
      <button id="backupDataBtn" class="settings-action-btn btn-backup">📥 데이터 백업 (다운로드)</button>
      <button id="restoreDataBtn" class="settings-action-btn btn-restore">📤 데이터 복원 (불러오기)</button>
      <!-- 눈에 안 보이는 실제 파일 첨부용 input -->
      <input type="file" id="restoreFileInput" accept=".json" style="display: none;">
    </div>
    <p class="settings-info">백업 파일은 .json 형태로 기기에 저장됩니다. 기기를 변경하거나 기록이 지워졌을 때 복원 버튼을 눌러 복구할 수 있습니다.</p>
  </div>

  <audio id="mainAudio" preload="metadata"></audio>
  <script src="app.js"></script>
</body>
</html>
